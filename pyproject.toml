[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepp"
version = "0.1.0"
description = "Reference implementation of the Network Earth Position Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Kenichi Iwata"}]

[project.optional-dependencies]
astronomy = ["astropy>=6"]

[project.scripts]
nepp-server = "nepp.server:main"
nepp-client = "nepp.client:main"

[tool.setuptools.packages.find]
where = ["src"]
