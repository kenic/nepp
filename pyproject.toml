[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepp"
version = "0.1.0"
description = "Reference implementation of the Network Earth Position Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Kenichi Iwata"}]

[project.optional-dependencies]
astronomy = ["astropy>=6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.scripts]
nepp-server = "nepp.server:main"
nepp-client = "nepp.client:main"
nepp-probe = "nepp.probe:main"

[tool.setuptools.packages.find]
where = ["src"]
