site_name: NEPP
site_url: https://nepp.kenic.jp/
site_description: A continuous Earth Date and its network protocol.
site_author: Kenichi Iwata
docs_dir: webdocs
site_dir: site
repo_name: kenic/nepp
repo_url: https://github.com/kenic/nepp
edit_uri: edit/main/webdocs/

hooks:
  - deploy/docs_hooks.py

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: ライトモード

nav:
  - 日本語:
      - NEPP: index.md
      - 暦: calendar.md
      - プロトコル: protocol.md
      - ドラフト・過去版: drafts/index.md
      - iPhoneアプリ: app.md
      - サポート: support.md
      - プライバシー: privacy.md
  - English:
      - NEPP: en/index.md
      - Calendar: en/calendar.md
      - Protocol: en/protocol.md
      - Drafts and revisions: en/drafts.md
      - iPhone App: en/app.md
      - Support: en/support.md
      - Privacy: en/privacy.md
  - Draft archive:
      - "-03 English (proposal)": drafts/draft-iwata-nepp-03.md
      - "-03 日本語（参考・提案）": drafts/draft-iwata-nepp-03-jp.md
      - "-02 English (proposal)": drafts/draft-iwata-nepp-02.md
      - "-02 日本語（参考・提案）": drafts/draft-iwata-nepp-02-jp.md
      - "-01 English": drafts/draft-iwata-nepp-01.md
      - "-01 日本語": drafts/draft-iwata-nepp-01-jp.md
      - "-00 English": drafts/draft-iwata-nepp-00.md
      - "-00 日本語": drafts/draft-iwata-nepp-00-jp.md
      - Implementation snapshot (V1): drafts/implementation-snapshot-v1.md

extra:
  alternate:
    - name: 日本語
      link: /
      lang: ja
    - name: English
      link: /en/
      lang: en

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/earth-date.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

copyright: Copyright &copy; 2026 Kenichi Iwata. NEPP reference implementation is BSD 3-Clause licensed.
