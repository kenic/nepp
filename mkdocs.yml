site_name: NEPP
site_url: https://nepp.kenic.jp/
site_description: A continuous Earth Date and its network protocol.
site_author: Kenichi Iwata
docs_dir: webdocs
site_dir: site
repo_name: kenic/nepp
repo_url: https://github.com/kenic/nepp
edit_uri: edit/main/webdocs/

theme:
  name: material
  language: ja
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: ライトモード

nav:
  - 日本語:
      - NEPP: index.md
      - 暦: calendar.md
      - プロトコル: protocol.md
      - iPhoneアプリ: app.md
  - English:
      - NEPP: en/index.md
      - Calendar: en/calendar.md
      - Protocol: en/protocol.md
      - iPhone App: en/app.md

extra:
  alternate:
    - name: 日本語
      link: /
      lang: ja
    - name: English
      link: /en/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables

copyright: Copyright &copy; 2026 Kenichi Iwata. NEPP reference implementation is BSD 3-Clause licensed.
