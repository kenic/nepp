# Optional systemd drop-in: /etc/systemd/system/nepp.service.d/web.conf
# Install only when intentionally switching the production server to draft-03 V2.
[Service]
ExecStart=
ExecStart=/opt/nepp/venv/bin/nepp-server --host ${NEPP_HOST} --port ${NEPP_PORT} --refresh ${NEPP_REFRESH} --http-port 8080 --log-level INFO
